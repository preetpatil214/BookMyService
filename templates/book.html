<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Booking - BookMyService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .fun-card {
            background-color: #313335;
            border-radius: 20px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
            transition: transform 0.3s ease;
        }
        .fun-card:hover {
            transform: translateY(-5px);
        }
        .fun-btn {
            background-color: #4486e8 !important;
            color: #ffffff !important;
            border: none;
            border-radius: 50px !important;
            transition: all 0.3s ease;
        }
        .fun-btn:hover {
            background-color: #336bbd !important;
            box-shadow: 0 5px 15px rgba(68, 134, 232, 0.4);
        }
        .fun-cancel {
            border: 2px solid #4486e8 !important;
            color: #4486e8 !important;
            border-radius: 50px !important;
            background: transparent;
            transition: all 0.3s ease;
        }
        .fun-cancel:hover {
            background-color: #4486e8 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="text-white" style="background-color: #4486e8;">

    <!-- Navbar -->
    <nav class="navbar px-4 shadow-sm" style="background-color: #313335;">
        <a class="navbar-brand fw-bold fs-3" href="/services">
            <span style="color:#f6f7f8;">Book</span><span style="color: #4486e8;">My</span><span style="color: #f6f7f8;">Service</span>
        </a>
        <div class="d-flex align-items-center">
            <a href="/services" class="btn btn-outline-light btn-sm rounded-pill px-3">Back to Services</a>
        </div>
    </nav>

    <!-- Main Booking Container -->
    <div class="container my-5">
        <div class="card fun-card border-0 mx-auto p-4" style="max-width: 500px;">
            
            <h2 class="text-center mb-4 fw-bold text-white" style="font-family: Segoe UI;">🎉 Confirm Your Booking</h2>
            
            <form action="/book" method="POST">
                <input type="hidden" name="company_name" value="{{ company_name }}">
                <input type="hidden" name="service_name" value="{{ service_name }}">

                <div class="mb-3">
                    <label class="form-label text-light small fw-bold" style="font-family: Segoe UI;">Company Name</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary rounded-pill px-3" value="{{ company_name }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small fw-bold" style="font-family: Segoe UI;">Service Type</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary rounded-pill px-3" value="{{ service_name }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="customer_address" class="form-label text-light small fw-bold" style="font-family: Segoe UI;">📍 Service Location / Address</label>
                    <textarea class="form-control bg-dark text-white border-secondary rounded-4 px-3" id="customer_address" name="customer_address" rows="2" placeholder="Drop your full address here..." required></textarea>
                </div>

                <div class="mb-3">
                    <label for="booking_date" class="form-label text-light small fw-bold" style="font-family: Segoe UI;">📅 Booking Date</label>
                    <input type="date" class="form-control bg-dark text-white border-secondary rounded-pill px-3" id="booking_date" name="booking_date" required>
                </div>

                <div class="mb-4">
                    <label for="booking_time" class="form-label text-light small fw-bold" style="font-family: Segoe UI;"> Preferred Time Slot</label>
                    <select class="form-select bg-dark text-white border-secondary rounded-pill px-3" id="booking_time" name="booking_time" required>
                        <option value="" disabled selected> Select a comfortable slot</option>
                        <option value="08:00:00 - 10:00:00">08:00:00 - 10:00:00</option>
                        <option value="10:00:00 - 12:00:00">10:00:00 - 12:00:00</option>
                        <option value="12:00:00 - 14:00:00">12:00:00 - 14:00:00</option>
                        <option value="14:00:00 - 16:00:00">14:00:00 - 16:00:00</option>
                        <option value="16:00:00 - 18:00:00">16:00:00 - 18:00:00</option>
                        <option value="18:00:00 - 20:00:00">18:00:00 - 20:00:00</option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn fun-btn fw-bold py-2 shadow-sm" style="font-family: Segoe UI;"> Confirm & Book Now</button>
                    <a href="/companies?service={{ service_name }}" class="btn fun-cancel py-2 fw-bold text-center text-decoration-none" style="font-family: Segoe UI;">Cancel</a>
                </div>
            </form>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Prevent booking dates in the past by setting the min attribute to today's date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('booking_date').setAttribute('min', today);
    </script>
</body>
</html>

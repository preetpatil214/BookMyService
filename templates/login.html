<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookMyService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .fun-card {
            background-color: #313335;
            border-radius: 20px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
            transition: transform 0.3s ease;
        }
        .fun-card:hover {
            transform: translateY(-5px);
        }
        .fun-btn {
            background-color: #4486e8 !important;
            color: #ffffff !important;
            border: none;
            border-radius: 50px !important;
            transition: all 0.3s ease;
        }
        .fun-btn:hover {
            background-color: #336bbd !important;
            box-shadow: 0 5px 15px rgba(68, 134, 232, 0.4);
        }
    </style>
</head>
<body class="text-white d-flex align-items-center justify-content-center vh-100" style="background-color: #4486e8;">


    <div class="container">
        <div class="card fun-card border-0 mx-auto p-4" style="max-width: 400px;">
            
            <div class="text-center mb-4">
                <a class="navbar-brand fw-bold fs-2 text-decoration-none" href="/">
                    <span style="color:#f6f7f8;">Book</span><span style="color: #4486e8;">My</span><span style="color: #f6f7f8;">Service</span>
                </a>
                <p class="text-light small mt-1" style="font-family: Segoe UI;">Your Service , Your Schedule - Preet M. Patil</p>
            </div>
            
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label text-light small fw-bold" style="font-family: Segoe UI;"> Username</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary rounded-pill px-3" id="name" name="name" placeholder="Enter your username..." required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light small fw-bold" style="font-family: Segoe UI;"> Password</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary rounded-pill px-3" id="password" name="password" placeholder="Enter your password..." required>
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn fun-btn fw-bold py-2 shadow-sm" style="font-family: Segoe UI;"> Login</button>
                </div>

                <div class="text-center">
                    <p class="small text-light" style="font-family: Segoe UI;">Don't have an account? <a href="/register" class="text-info text-decoration-none fw-bold">Register here</a></p>
                </div>
            </form>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

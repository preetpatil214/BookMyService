<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>BookMyService - Register</title>
</head>
<body class="bg-dark text-white">

    <nav class="navbar px-4 shadow-sm" style="background-color: #313335;">
        <a class="navbar-brand fw-bold fs-3" href="/login">
            <span style="color:#f6f7f8;">Book</span><span style="color: #4486e8;">My</span><span style="color: #f6f7f8;">Service</span>
        </a>
    </nav>

    <div class="container text-center mt-5">
        <h1 class="fw-bold text-white" style="font-family:Segoe UI">
          Book<span style="color: #4486e8;">My</span>Service
        </h1>
        <p class="text-secondary" style="font-family: fantasy; color: #4486e8;">Create a new customer account</p>

        <div class="card shadow p-4 mx-auto mt-4 text-white border-0 shadow-lg" style="max-width: 400px; background-color: #4486e8;">
            <h1 class="text-center mb-4" style="font-family:fantasy; color: #f6f7f8;">Sign Up</h1>

            <form action="/register" method="POST">
                <div class="form-floating mb-3">
                  <input type="text" class="form-control bg-dark text-light border-secondary" id="floatingInput" name="name" placeholder="username">
                  <label for="floatingInput" style="color: #313335; font-family: fantasy;">Username</label>
                </div>
                <div class="form-floating mb-3">
                  <input type="password" class="form-control bg-dark text-light border-secondary" name="password" id="floatingPassword" placeholder="Password">
                  <label for="floatingPassword" style="color: #313335; font-family: fantasy;">Password</label>
                </div>
                <button type="submit" class="btn w-100 mt-2 fw-bold text-dark shadow-sm bg-light" style="font-family: fantasy;">Register</button>
            </form>

            <p class="mb-0 mt-3 text-white" style="font-family: Segoe UI;">Already have an account?</p>
            <a href="/login" class="btn btn-outline-light btn-sm mt-2 fw-bold" style="font-family: Segoe UI;">Back to Login</a>
        </div>
    </div>
</body>
</html>
